# ============ DHARIGA MART - Spring Boot Configuration ============

spring.application.name=dhariga-mart
server.port=${PORT:8080}

# ---------- MySQL 8 Connection ----------
# Dedicated app user 'dhariga' was created on this machine (see database/schema.sql).
# If you use your own MySQL, set username/password to an account with rights on dhariga_mart.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dhariga_mart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dhariga}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dhariga123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# 'update' auto-creates tables from entities on first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ---------- SQL init (sample data) ----------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- JWT ----------
app.jwt.secret=${APP_JWT_SECRET:DHARIGA_MART_SUPER_SECRET_KEY_USE_AT_LEAST_32_CHARS_2026}
app.jwt.expiration-ms=86400000

# ---------- Logging ----------
logging.level.org.hibernate.SQL=info
logging.level.com.dharigamart=debug