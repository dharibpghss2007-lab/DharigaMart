<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <header id="siteNavbar"></header>

    <main class="page-head">
        <div class="container">
            <h2 class="mb-1">Shopping Cart</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Cart</li>
                </ol>
            </nav>
        </div>
    </main>

    <section class="section">
        <div class="container">

            <div id="cartLoader" class="text-center py-5">
                <div class="spinner-border text-brand spinner-lg" role="status"></div>
                <p class="text-muted mt-3 mb-0">Loading your cart...</p>
            </div>

            <div id="cartEmpty" class="empty-state d-none">
                <i class="bi bi-cart-x"></i>
                <h5>Your cart is empty</h5>
                <p class="text-muted mb-3">Looks like you haven't added anything yet.</p>
                <a href="products.html" class="btn btn-brand">Start Shopping</a>
            </div>

            <div id="cartContent" class="d-none">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div id="cartItems"></div>
                        <div class="mt-3">
                            <a href="products.html" class="btn btn-outline-brand">
                                <i class="bi bi-arrow-left"></i> Continue Shopping
                            </a>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="summary-card">
                            <h5 class="mb-3">Order Summary</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal (<span id="cartCountLabel">0</span> items)</span>
                                <span id="cartSubtotal"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Delivery</span>
                                <span id="cartShipping">Free</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span id="cartTotal"></span>
                            </div>
                            <p class="small text-muted mt-2 mb-3">
                                <i class="bi bi-info-circle"></i> Free delivery on orders above ₹999.
                            </p>
                            <a href="checkout.html" class="btn btn-brand w-100 btn-lg">
                                Proceed to Checkout <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer id="siteFooter"></footer>

    <!-- toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/cart.js"></script>
</body>
</html>
