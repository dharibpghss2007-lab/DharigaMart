<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <header id="siteNavbar"></header>

    <main class="page-head">
        <div class="container">
            <h2 class="mb-1">My Account</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">My Account</li>
                </ol>
            </nav>
        </div>
    </main>

    <section class="section">
        <div class="container">
            <div class="row g-4">

                <!-- Profile -->
                <div class="col-lg-4">
                    <div class="summary-card text-center">
                        <div class="profile-circle mx-auto">
                            <i class="bi bi-person"></i>
                        </div>
                        <h4 id="accountName" class="mt-3 mb-0"></h4>
                        <p id="accountEmail" class="text-muted mb-2"></p>
                        <p id="accountPhone" class="small text-muted mb-3"><i class="bi bi-telephone"></i></p>
                        <hr>
                        <div class="d-flex justify-content-between small">
                            <span class="text-muted">Total Orders</span>
                            <span class="fw-semibold" id="totalOrders">0</span>
                        </div>
                        <button class="btn btn-outline-brand w-100 mt-3" id="logoutBtn">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>
                </div>

                <!-- Order history -->
                <div class="col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="bi bi-bag-check text-brand me-2"></i>Order History</h5>
                    </div>

                    <div id="ordersLoader" class="text-center py-5">
                        <div class="spinner-border text-brand" role="status"></div>
                    </div>

                    <div id="noOrders" class="empty-state d-none border-0">
                        <i class="bi bi-receipt"></i>
                        <h5>No orders yet</h5>
                        <p class="text-muted mb-3">Place your first order to see it here.</p>
                        <a href="products.html" class="btn btn-brand">Shop Now</a>
                    </div>

                    <div id="orderList" class="d-flex flex-column gap-4"></div>
                </div>
            </div>
        </div>
    </section>

    <footer id="siteFooter"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/my-account.js"></script>
</body>
</html>
