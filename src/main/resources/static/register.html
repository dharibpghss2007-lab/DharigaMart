<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-wrap">
        <div class="auth-card auth-card-wide shadow-lg">
            <div class="text-center mb-4">
                <div class="brand-logo mx-auto">
                    <i class="bi bi-gem"></i>
                </div>
                <h1 class="brand-name mt-3">Create Account</h1>
                <p class="tagline mb-0">Join DHARIGA MART - Style. Beauty. Confidence. Easy Shopping.</p>
            </div>

            <div id="registerAlert" class="alert d-none text-center small" role="alert"></div>

            <form id="registerForm" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="name">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" placeholder="Your full name">
                        </div>
                        <div class="invalid-feedback" id="nameError"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="phone">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" id="phone" placeholder="10-digit mobile number"
                                   maxlength="10">
                        </div>
                        <div class="invalid-feedback" id="phoneError"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Min 6 characters">
                            <button class="btn btn-outline-secondary" type="button" data-toggle-pw="password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" id="passwordError"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password">
                            <button class="btn btn-outline-secondary" type="button" data-toggle-pw="confirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" id="confirmError"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100 btn-lg" id="registerBtn">
                    <span class="spinner-border spinner-border-sm d-none" id="registerSpinner"></span>
                    Create Account
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Already have an account?
                <a href="login.html" class="link-brand fw-semibold">Login</a>
            </p>
        </div>
        <p class="text-center text-white-50 mt-3 small">&copy; <span id="year"></span> DHARIGA MART</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
