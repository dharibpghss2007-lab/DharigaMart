<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <header id="siteNavbar"></header>

    <main class="page-head">
        <div class="container">
            <h2 class="mb-1">Checkout</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item"><a href="cart.html">Cart</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Checkout</li>
                </ol>
            </nav>
        </div>
    </main>

    <section class="section">
        <div class="container">

            <div id="checkoutLoader" class="text-center py-5">
                <div class="spinner-border text-brand spinner-lg" role="status"></div>
                <p class="text-muted mt-3 mb-0">Preparing checkout...</p>
            </div>

            <div id="checkoutEmpty" class="empty-state d-none">
                <i class="bi bi-cart-x"></i>
                <h5>Your cart is empty</h5>
                <a href="products.html" class="btn btn-brand mt-2">Browse Products</a>
            </div>

            <!-- Checkout form -->
            <div id="checkoutContent" class="d-none">
                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="checkout-card">
                            <h5 class="mb-4"><i class="bi bi-geo-alt-fill text-brand me-2"></i>Delivery Details</h5>
                            <form id="checkoutForm" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="cName">Full Name</label>
                                        <input type="text" class="form-control" id="cName">
                                        <div class="invalid-feedback" id="cNameError"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="cPhone">Phone Number</label>
                                        <input type="tel" class="form-control" id="cPhone" maxlength="10">
                                        <div class="invalid-feedback" id="cPhoneError"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="cEmail">Email Address</label>
                                        <input type="email" class="form-control" id="cEmail">
                                        <div class="invalid-feedback" id="cEmailError"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="cAddress">Address</label>
                                        <textarea class="form-control" id="cAddress" rows="2"
                                                  placeholder="House no, street, locality"></textarea>
                                        <div class="invalid-feedback" id="cAddressError"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="cCity">City</label>
                                        <input type="text" class="form-control" id="cCity">
                                        <div class="invalid-feedback" id="cCityError"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="cState">State</label>
                                        <select class="form-select" id="cState">
                                            <option value="">Select state</option>
                                        </select>
                                        <div class="invalid-feedback" id="cStateError"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="cPincode">Pincode</label>
                                        <input type="text" class="form-control" id="cPincode" maxlength="6">
                                        <div class="invalid-feedback" id="cPincodeError"></div>
                                    </div>
                                </div>
                                <div id="checkoutAlert" class="alert alert-danger d-none mt-3 small"></div>
                            </form>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="summary-card">
                            <h5 class="mb-3">Order Summary</h5>
                            <div id="checkoutItems"></div>
                            <hr>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal (<span id="checkoutCountLabel">0</span> items)</span>
                                <span id="checkoutSubtotal"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Delivery</span>
                                <span id="checkoutShipping">Free</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Final Total</span>
                                <span id="checkoutTotal"></span>
                            </div>
                            <button class="btn btn-brand w-100 btn-lg mt-3" id="placeOrderBtn">
                                <span class="spinner-border spinner-border-sm d-none" id="placeOrderSpinner"></span>
                                <i class="bi bi-bag-check"></i> Place Order
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Success -->
            <div id="checkoutSuccess" class="empty-state d-none">
                <i class="bi bi-check-circle-fill text-success success-icon"></i>
                <h4 class="mt-3">Order Placed Successfully!</h4>
                <p class="text-muted mb-1">Your Order ID:</p>
                <h3 id="orderNumber" class="text-brand fw-bold"></h3>
                <p class="text-muted mt-2" id="orderStatusText"></p>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="my-account.html" class="btn btn-brand px-4">Track in My Account</a>
                    <a href="products.html" class="btn btn-outline-brand px-4">Continue Shopping</a>
                </div>
            </div>
        </div>
    </section>

    <footer id="siteFooter"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
