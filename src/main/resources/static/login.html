<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-wrap">
        <div class="auth-card shadow-lg">
            <div class="text-center mb-4">
                <div class="brand-logo mx-auto">
                    <i class="bi bi-gem"></i>
                </div>
                <h1 class="brand-name mt-3">DHARIGA MART</h1>
                <p class="tagline mb-0">Style. Beauty. Confidence. Easy Shopping.</p>
            </div>

            <div id="loginAlert" class="alert d-none text-center small" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com"
                               autocomplete="email">
                    </div>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password"
                               autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                aria-label="Show or hide password">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="link-brand" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-brand w-100 btn-lg" id="loginBtn">
                    <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                    Login
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                New to DHARIGA MART?
                <a href="register.html" class="link-brand fw-semibold">Create an Account</a>
            </p>
        </div>
        <p class="text-center text-white-50 mt-3 small">&copy; <span id="year"></span> DHARIGA MART</p>
    </div>

    <!-- Forgot Password modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Forgot Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Enter your registered email and we will send you a reset link.</p>
                    <form id="forgotForm">
                        <div class="mb-2">
                            <input type="email" class="form-control" id="forgotEmail" placeholder="Registered email">
                            <div class="invalid-feedback" id="forgotEmailError"></div>
                        </div>
                        <button type="submit" class="btn btn-brand w-100">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
