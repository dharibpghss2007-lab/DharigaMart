<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <header id="siteNavbar"></header>

    <main class="page-head">
        <div class="container">
            <h2 class="mb-1">Products</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Products</li>
                </ol>
            </nav>
        </div>
    </main>

    <section class="section">
        <div class="container">

            <!-- Toolbar -->
            <div class="filter-bar mb-4">
                <div class="row g-3 align-items-center">
                    <div class="col-lg-5">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                            <button class="btn btn-brand" id="searchBtn" type="button">Search</button>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="d-flex flex-wrap gap-2 category-chips" id="categoryChips">
                            <button class="chip active" data-category="">All</button>
                        </div>
                    </div>
                    <div class="col-lg-2">
                        <select id="sortSelect" class="form-select">
                            <option value="">Sort by: Default</option>
                            <option value="asc">Price: Low to High</option>
                            <option value="desc">Price: High to Low</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="activeFilter" class="text-muted small mb-3"></div>

            <!-- Loading & empty states -->
            <div id="productsLoader" class="text-center py-5">
                <div class="spinner-border text-brand spinner-lg" role="status"></div>
                <p class="text-muted mt-3 mb-0">Loading products...</p>
            </div>
            <div id="emptyState" class="empty-state d-none">
                <i class="bi bi-search"></i>
                <h5>No products found</h5>
                <p class="text-muted mb-3">Try a different search term or category.</p>
                <button class="btn btn-outline-brand" onclick="resetFilters()">Clear Filters</button>
            </div>

            <div class="row g-4" id="productGrid"></div>
        </div>
    </section>

    <footer id="siteFooter"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/products.js"></script>
</body>
</html>
