<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | DHARIGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <header id="siteNavbar"></header>

    <main class="page-head">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item"><a href="products.html">Products</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbName" aria-current="page">Details</li>
                </ol>
            </nav>
        </div>
    </main>

    <section class="section">
        <div class="container">
            <div id="productLoader" class="text-center py-5">
                <div class="spinner-border text-brand spinner-lg" role="status"></div>
                <p class="text-muted mt-3 mb-0">Loading product...</p>
            </div>

            <div id="productContent" class="d-none row g-5">
                <!-- Image -->
                <div class="col-lg-6">
                    <div class="product-gallery rounded-4 overflow-hidden">
                        <img id="pImage" src="" alt="Product image" class="img-fluid w-100">
                    </div>
                </div>

                <!-- Info -->
                <div class="col-lg-6">
                    <span id="pCategory" class="badge-cat"></span>
                    <h2 id="pName" class="product-title mt-2"></h2>
                    <div class="d-flex align-items-center gap-2 my-2">
                        <span id="pRating" class="rating-badge"></span>
                        <span class="text-muted" id="pStock"></span>
                    </div>
                    <h3 id="pPrice" class="product-price my-3"></h3>
                    <p id="pDesc" class="text-muted"></p>

                    <div class="d-flex align-items-center gap-3 mt-4">
                        <div class="qty-box">
                            <button class="qty-btn" id="qtyMinus" type="button"><i class="bi bi-dash"></i></button>
                            <input id="qtyInput" class="qty-input" type="number" value="1" min="1">
                            <button class="qty-btn" id="qtyPlus" type="button"><i class="bi bi-plus"></i></button>
                        </div>
                        <div class="text-muted small">Max <span id="pMaxStock"></span> units</div>
                    </div>

                    <div class="d-flex flex-wrap gap-3 mt-4">
                        <button class="btn btn-outline-brand btn-lg flex-fill" id="addToCartBtn">
                            <i class="bi bi-cart-plus"></i> Add to Cart
                        </button>
                        <a class="btn btn-brand btn-lg flex-fill" id="buyNowBtn">
                            <i class="bi bi-lightning-charge"></i> Buy Now
                        </a>
                    </div>
                </div>
            </div>

            <div id="productNotFound" class="empty-state d-none">
                <i class="bi bi-box"></i>
                <h5>Product not found</h5>
                <a href="products.html" class="btn btn-outline-brand mt-2">Back to Products</a>
            </div>
        </div>
    </section>

    <footer id="siteFooter"></footer>

    <!-- toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/product-details.js"></script>
</body>
</html>
